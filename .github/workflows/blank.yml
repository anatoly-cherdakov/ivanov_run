name: Temporary photo fetch
on:
  push:
    branches: [ "main" ]
permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet pillow requests
      - name: Download and encode photos
        run: |
          python - <<'PY'
          import base64, json, requests
          from io import BytesIO
          from PIL import Image, ImageOps
          sources = {
            2016: 'https://knownway.com/images/catalog/1642024838.jpg',
            2017: 'https://trekkingmania.ru/aimages/858/c1/img-1530.jpg',
            2018: 'https://welcome.mosreg.ru/cache/thumbs/thumb_1920__2690176883.jpg',
            2019: 'https://www.pv-muenchen.de/fileadmin/Medien_PV/News/2025/PV_in_den_Medien/Olympiapark_c_pixabay_3_2_web.jpg',
            2020: 'https://mf.b37mrtl.ru/rbthmedia/images/2019.01/original/5c4b25f085600a7dd23752b1.jpg',
            2021: 'https://sobory.ru/pic/01750/01798_20150608_200815.jpg',
            2022: 'https://mf.b37mrtl.ru/rbthmedia/images/2022.10/original/6357a7fc6a1fe1625d20b4eb.jpg',
            2023: 'https://static.tildacdn.com/tild3735-6536-4132-a530-313762656465/alexander-smagin-MEW.jpg',
            2024: 'https://visitrussia.com/assets/thumbnails/4c/4c0d15ff2f180769cb0020b6d1859ee5.jpg',
            2025: 'https://www.russia.tours/images/gallery/excursion/34/1931/h500.jpg?_=3666927798',
          }
          session = requests.Session()
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/143 Safari/537.36',
              'Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'
          })
          out = {}
          errors = {}
          for year, url in sources.items():
              try:
                  r = session.get(url, timeout=60)
                  r.raise_for_status()
                  im = Image.open(BytesIO(r.content))
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  im.thumbnail((720, 480), Image.Resampling.LANCZOS)
                  buf = BytesIO()
                  im.save(buf, 'WEBP', quality=72, method=6)
                  out[str(year)] = 'data:image/webp;base64,' + base64.b64encode(buf.getvalue()).decode('ascii')
                  print(year, r.status_code, len(r.content), '->', len(buf.getvalue()))
              except Exception as e:
                  errors[str(year)] = repr(e)
                  print('ERROR', year, repr(e))
          with open('photos.json','w',encoding='utf-8') as f:
              json.dump({'photos':out,'errors':errors}, f)
          if errors:
              print('Errors:', errors)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: year-photos
          path: photos.json
          retention-days: 1
