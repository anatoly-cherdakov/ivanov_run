name: Обновление результатов ПроБЕГ
on:
  push:
    branches: [main]
    paths: ['scripts/fetch_probeg.py', '.github/workflows/blank.yml']
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-probeg-ivanov
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_probeg.py
      - name: Save results
        run: |
          git add probeg-results.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Vladimir Ivanov ProBEG results'
          git push
